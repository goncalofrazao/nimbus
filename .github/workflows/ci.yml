name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test ./...
      - name: benchmark smoke run
        run: go run ./cmd/nimbus -ticks 720 -seed 42

  integration:
    runs-on: ubuntu-latest # GitHub-hosted runners ship a running Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: docker available
        run: docker version
      - name: pre-pull test image
        run: docker pull busybox:latest
      - name: integration tests
        run: go test -tags=integration -v ./test/integration/...
